# M3 QLoRA trainer config — REAL 7B run (Colab T4)
# For a quick CPU smoke keep config/train.yaml (SmolLM2-135M).
model:
  id: Qwen/Qwen2.5-7B

lora:
  r: 16           # <= 64 per assignment
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  max_steps: 2000
  max_seq_len: 512

dataset:
  train_jsonl: data/train.jsonl

vram_guard:
  budget_gb: 12.0            # RTX 3060 12GB / Colab T4 16GB
  base_params: 7600000000    # Qwen2.5-7B
  hidden_size: 3584          # Qwen2.5-7B hidden size
  lora_modules:
    - { in_features: 3584 }
    - { in_features: 3584 }
    - { in_features: 3584 }
    - { in_features: 3584 }
    - { in_features: 3584 }
    - { in_features: 3584 }
    - { in_features: 3584 }

output:
  dir: data/out
